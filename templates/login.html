<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - Printers Supplies</title>
<style>
body{font-family:sans-serif;background:#f0f4ff;display:flex;align-items:center;justify-content:center;height:100vh;}
form{background:white;padding:30px;border-radius:10px;box-shadow:0 10px 25px rgba(0,0,0,.1);}
input{width:100%;padding:8px;margin:8px 0;}
button{background:#2563eb;color:#fff;border:none;padding:10px;width:100%;border-radius:6px;}
</style>
</head>
<body>
<form method="POST">
<h2>🖨️ Printers Supplies</h2>
{% if error %}<p style="color:red">{{error}}</p>{% endif %}
<input type="text" name="username" placeholder="Username" required>
<input type="password" name="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
</body>
</html>
