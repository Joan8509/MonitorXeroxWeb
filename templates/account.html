<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Account</title>
<style>
body{font-family:sans-serif;background:#f0f4ff;padding:30px;}
form{background:white;padding:30px;border-radius:10px;box-shadow:0 10px 25px rgba(0,0,0,.1);max-width:400px;margin:auto;}
input{width:100%;padding:8px;margin:8px 0;}
button{background:#2563eb;color:#fff;border:none;padding:10px;width:100%;border-radius:6px;}
</style>
</head>
<body>
<form method="POST">
<h2>Account Settings</h2>
{% if message %}<p style="color:green">{{message}}</p>{% endif %}
<p>Current user: <b>{{username}}</b></p>
<input type="text" name="new_username" placeholder="New username">
<input type="password" name="new_password" placeholder="New password">
<button type="submit">Update</button>
<p><a href="/">← Back to Home</a></p>
</form>
</body>
</html>
