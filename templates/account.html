<!doctype html>
<html lang="{{ current_lang }}">
<head>
  <meta charset="utf-8">
  <title>{{ t("account_settings") }} - Printers Supplies</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<div class="container">

  <div class="topbar">
    <div class="title">
      <svg class="printer-ico" viewBox="0 0 24 24" fill="none">
        <path d="M7 8V4h10v4" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="3" y="8" width="18" height="8" rx="2" stroke="#0ea5e9" stroke-width="2"/>
        <path d="M7 16v4h10v-4" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="17.5" cy="12" r="1" fill="#10b981"/>
      </svg>
      <h1 class="title-text">Printers Supplies</h1>
    </div>

    <nav class="user-menu">
      <span class="um-muted">{{ t("signed_in_as") }}</span> <strong>{{ username }}</strong>
      <span class="um-sep">·</span><a href="{{ url_for('auth.set_language', lang='en') }}">EN</a>
      <span class="um-sep">·</span><a href="{{ url_for('auth.set_language', lang='es') }}">ES</a>
      <span class="um-sep">·</span><a href="{{ url_for('home.home') }}">{{ t("home") }}</a>
      <span class="um-sep">·</span><a href="{{ url_for('auth.logout') }}">{{ t("logout") }}</a>
    </nav>
  </div>

  <div class="card">
    <h2 style="margin:0 0 10px 0;font-size:18px;font-weight:800;">{{ t("account_settings") }}</h2>
    <p style="margin:0 0 18px 0;font-size:13px;color:#6b7280;">
      {{ t("account_summary") }}
    </p>

    <div class="row" style="margin-bottom:14px;">
      <div class="stack w-280">
        <label>{{ t("username") }}</label>
        <input value="{{ username }}" readonly>
      </div>
    </div>

    <p style="margin:0;font-size:12px;color:#9ca3af;">
      {{ t("account_note") }}
    </p>
  </div>

</div>
</body>
</html>
