<!doctype html>
<html lang="{{ current_lang }}">
<head>
  <meta charset="utf-8">
  <title>Printers Supplies - Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <header style="padding:10px 16px; background:#1e293b; color:white; display:flex; justify-content:space-between; align-items:center;">
    <div style="font-weight:700;">Printers Supplies</div>
    <div>
      <span style="margin-right:12px; font-size:14px;">{{ username }}</span>
      <a href="{{ url_for('auth.set_language', lang='en') }}" style="color:#e5e7eb; font-size:14px; margin-right:8px;">EN</a>
      <a href="{{ url_for('auth.set_language', lang='es') }}" style="color:#e5e7eb; font-size:14px; margin-right:12px;">ES</a>
      <a href="{{ url_for('auth.logout') }}" style="color:#e5e7eb; font-size:14px;">{{ t("logout") }}</a>
    </div>
  </header>

  <main style="padding:20px;">
    <h2>{{ t("dashboard_phase") }}</h2>
    <p>{{ t("dashboard_placeholder") }}</p>
  </main>
</body>
</html>
